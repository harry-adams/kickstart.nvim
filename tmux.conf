# ~/.tmux.conf

# Prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind s choose-tree -Zs
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Core settings
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g status on
set -g status-position top
set -g status-interval 5
set -g set-titles on
set -g set-titles-string '#T'
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g display-panes-time 2000

# Status bar background and window transparency
set -g status-style fg=#ebdbb2,bg=default
set -g window-style bg=default
set -g window-active-style bg=default

# Left: session name
set -g status-left-length 30
set -g status-left '#[fg=#232423,bg=#fe8019,bold] #S #[fg=#fe8019,bg=default,nobold]'

# Windows
set -g window-status-separator ''
setw -g window-status-style fg=default,bg=default
setw -g window-status-activity-style fg=#fabd2f,bg=default
setw -g window-status-bell-style fg=default,bg=default
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#8ec07c,bg=default]#[fg=#232423,bg=#8ec07c,bold] #I:#W #[fg=#8ec07c,bg=default,nobold]'

# Right: date and time
set -g status-right-length 55
set -g status-right '#[fg=#83a598,bg=default]#[fg=#232423,bg=#83a598] %Y-%m-%d #[fg=#fabd2f,bg=#83a598]#[fg=#232423,bg=#fabd2f] %H:%M '

# Panes
set -g pane-border-style fg=#504945
set -g pane-active-border-style fg=#8ec07c

# Prompts, messages, and copy mode
set -g message-style bg=default,fg=#a89984
set -g message-command-style bg=default,fg=#a89984
set -g mode-style bg=#504945,fg=#a89984
set -g monitor-activity on
set -g visual-activity off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

